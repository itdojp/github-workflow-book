title: "AI開発のためのGitHubワークフロー実践ガイド"
description: "ChatGPT/GitHub Copilot/Claude等のAI開発者ツールとGitHubを統合した開発手法を体系的に解説。AI時代のソフトウェア開発に必要なワークフロー、セキュリティ、ガバナンス、大規模開発の実践的ノウハウを網羅。"
author: "太田和彦"
baseurl: "/github-workflow-book"
url: "https://itdojp.github.io"

# v3.0 Design System Configuration
markdown: kramdown
highlighter: rouge

# Use custom book layout as default
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "book"

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter

# Repository information for edit links
repository: "https://github.com/itdojp/github-workflow-book"

exclude:
  - node_modules/
  - scripts/
  - templates/
  - src/
  - package*.json
  - README.md
  - "*.tmp"
  - Gemfile*
