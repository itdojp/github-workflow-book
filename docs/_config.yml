# Jekyll設定
title: AI開発のためのGitHubワークフロー実践ガイド
description: AI協働時代に対応した、世界初の実践的GitHubワークフローガイドブック
author: 
  name: ITDO Inc. (株式会社アイティードゥ) 太田和彦
  github: itdojp
  email: knowledge@itdo.jp
baseurl: "/github-workflow-book-public"
url: "https://itdojp.github.io"

# Repository settings for links
repository:
  github: itdojp/github-workflow-book-public
  zenn: books/github-workflow-ai

# テーマ
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# 言語設定
lang: ja

# SEO settings
twitter:
  username: itdojp
  card: summary_large_image

# Google Analytics
google_analytics:

# GitHub metadata
github:
  repository_name: github-workflow-book-public
  repository_url: https://github.com/itdojp/github-workflow-book-public

# その他の設定
show_downloads: false

# ビルド設定
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Collections for organized content
collections:
  chapters:
    output: true
    permalink: /:collection/:name/
  appendices:
    output: true
    permalink: /:collection/:name/

# Exclude files from Jekyll build
exclude:
  - README.md
  - package.json
  - package-lock.json
  - node_modules/
  - scripts/
  - .gitignore
  - LICENSE
  - CONTRIBUTING.md
  - src/
  - CLAUDE.md
  - requirements.txt
  - zenn/
  - "*.py"
  - .build-meta.json
  - book-config.json