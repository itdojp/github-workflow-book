<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- favicon設定 -->
    <link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/images/itdo_logo_48x48_blue.png' | relative_url }}">
    <link rel="shortcut icon" type="image/png" href="{{ '/assets/images/itdo_logo_48x48_blue.png' | relative_url }}">
    
    <!-- GitHub Pages remote theme CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    
    <!-- Mermaid.js for diagrams -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.esm.min.mjs';
        
        document.addEventListener('DOMContentLoaded', function() {
            mermaid.initialize({
                startOnLoad: true,
                theme: 'default',
                securityLevel: 'loose'
            });
            
            // Process language-mermaid code blocks
            document.querySelectorAll('code.language-mermaid').forEach((block) => {
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.textContent;
                block.parentNode.replaceChild(div, block);
            });
            
            mermaid.run();
        });
    </script>
    
    <!-- Custom styles -->
    <style>
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 80px; /* フッターとの重なりを防ぐための下部マージン */
        }
        
        .mermaid {
            text-align: center;
            margin: 20px 0;
        }
        
        /* 目次のスタイリング */
        .toc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .toc-section {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background-color: #f9f9f9;
        }
        
        .toc-section h4 {
            margin-top: 0;
            color: #333;
        }
        
        .toc-section ul {
            list-style-type: none;
            padding-left: 0;
        }
        
        .toc-section li {
            margin: 5px 0;
        }
        
        .toc-section a {
            text-decoration: none;
            color: #0366d6;
        }
        
        .toc-section a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        {{ content }}
        
        <!-- 著作権表示 -->
        <footer style="margin-top: 60px; padding: 30px 0; border-top: 1px solid #eee; text-align: center; color: #666; font-size: 0.9em;">
            <p>Copyright (c) 2025 ITdo Japan, Inc. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
