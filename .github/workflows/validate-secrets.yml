name: Validate Secrets Configuration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/secrets-template.yml'
      - '.github/workflows/validate-secrets.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Check deployment configuration
        id: deploy-config
        run: |
          # デプロイ設定を確認
          if [ -f ".deploy-config.json" ]; then
            PUBLIC_REPO=$(jq -r '.publicRepo // ""' .deploy-config.json)
            if [ -n "$PUBLIC_REPO" ]; then
              # リポジトリが同じ組織かチェック
              CURRENT_ORG=$(echo "${{ github.repository }}" | cut -d'/' -f1)
              PUBLIC_ORG=$(echo "$PUBLIC_REPO" | sed -E 's|https://github.com/([^/]+)/.*|\1|')
              
              if [ "$CURRENT_ORG" = "$PUBLIC_ORG" ]; then
                echo "same_org=true" >> $GITHUB_OUTPUT
              else
                echo "same_org=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "same_org=unknown" >> $GITHUB_OUTPUT
            fi
          else
            echo "same_org=unknown" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate required secrets
        run: |
          echo "🔍 シークレット設定の検証"
          echo "========================="
          
          ERRORS=0
          WARNINGS=0
          
          # 同一組織かどうかで必要なシークレットが変わる
          SAME_ORG="${{ steps.deploy-config.outputs.same_org }}"
          
          if [ "$SAME_ORG" = "false" ]; then
            # 異なる組織へのデプロイ
            if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
              echo "❌ DEPLOY_TOKEN が設定されていません"
              echo "   異なる組織へのデプロイには Personal Access Token が必要です"
              echo "   設定方法: リポジトリ Settings → Secrets → New repository secret"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ DEPLOY_TOKEN: 設定済み"
            fi
          elif [ "$SAME_ORG" = "true" ]; then
            echo "✅ 同一組織内デプロイ: GITHUB_TOKEN を使用（追加設定不要）"
          else
            echo "⚠️  デプロイ設定が不明です"
            echo "   .deploy-config.json を確認するか、npm run setup:deploy を実行してください"
            WARNINGS=$((WARNINGS + 1))
          fi
          
          # オプションシークレットの確認
          echo ""
          echo "📋 オプションシークレット:"
          
          if [ -n "${{ secrets.PUBLIC_REPO_URL }}" ]; then
            echo "✅ PUBLIC_REPO_URL: 設定済み"
          else
            echo "⚪ PUBLIC_REPO_URL: 未設定（自動検出を使用）"
          fi
          
          if [ -n "${{ secrets.GIT_USER_EMAIL }}" ]; then
            echo "✅ GIT_USER_EMAIL: 設定済み"
          else
            echo "⚪ GIT_USER_EMAIL: 未設定（デフォルト: actions@github.com）"
          fi
          
          if [ -n "${{ secrets.GIT_USER_NAME }}" ]; then
            echo "✅ GIT_USER_NAME: 設定済み"
          else
            echo "⚪ GIT_USER_NAME: 未設定（デフォルト: GitHub Actions）"
          fi
          
          # 結果サマリー
          echo ""
          echo "========================="
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS 個のエラーが見つかりました"
            echo "   npm run setup:secrets を実行して設定してください"
            exit 1
          elif [ $WARNINGS -gt 0 ]; then
            echo "⚠️  $WARNINGS 個の警告があります"
            exit 0
          else
            echo "✅ すべてのシークレットが正しく設定されています"
            exit 0
          fi